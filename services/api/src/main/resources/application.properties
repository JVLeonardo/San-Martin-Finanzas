spring.application.name=San Martin Finanzas API
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanmartinfinanzas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smf_local}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smf_local_only}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.profiles.default=local
